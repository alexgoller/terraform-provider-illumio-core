name: Documentation site

# Publishes the provider documentation to GitHub Pages.
#
# docs/ is the single source of truth: it is what tfplugindocs generates and
# what the Terraform Registry will publish. scripts/build-site.sh syncs it into
# website/ at build time, so the site and the Registry cannot drift apart.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - 'scripts/build-site.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time; don't cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync docs into the site
        run: ./scripts/build-site.sh

      - uses: actions/configure-pages@v5
        id: pages

      # This repo is served as a project page under /<repo>/. Without the base
      # path baked in, every relative_url link resolves to the domain root and
      # 404s. Deriving it from configure-pages keeps it correct if the repo is
      # renamed or moved to a user/org page (where base_path is empty).
      - name: Set Jekyll baseurl
        run: |
          sed -i "s|^baseurl:.*|baseurl: \"${{ steps.pages.outputs.base_path }}\"|" website/_config.yml
          grep '^baseurl:' website/_config.yml

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./website
          destination: ./_site

      # A link that resolves to the domain root instead of the project path is
      # the failure this guards against; it is invisible in a build that
      # otherwise succeeds.
      - name: Verify links are base-path prefixed
        run: |
          base='${{ steps.pages.outputs.base_path }}'
          if [ -n "$base" ] && grep -qE 'href="/(resources|data-sources|guides)/' _site/index.html; then
            echo "::error::nav links are missing the ${base} prefix and will 404"
            exit 1
          fi
          echo "link prefixes OK"

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
