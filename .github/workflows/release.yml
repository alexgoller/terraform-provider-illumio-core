# Build and publish release artifacts when a v* tag is pushed.
#
# Signing is optional. If the GPG_PRIVATE_KEY secret is set the checksum file is
# signed, which is a prerequisite for publishing to the Terraform Registry. If it
# is not set the release still happens, unsigned — which is what a mirror or a
# direct download from the release page needs. Previously the workflow failed at
# the GPG step and GoReleaser never ran at all.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      # Secrets cannot be read from a step-level `if`, so the presence of a
      # signing key is hoisted into a job-level variable here.
      HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GoReleaser resolves the previous tag, so it needs full history.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Import GPG key
        id: import_gpg
        if: env.HAS_GPG_KEY == 'true'
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          # Pinned to the v2 line: the config is version 2, and `--rm-dist` was
          # removed in v2 in favour of `--clean`.
          version: '~> v2'
          # The non-empty branch must sit on the left of `&&`. GitHub's ternary
          # is `cond && A || B`, which returns B whenever A is falsy — and an
          # empty string is falsy. Written as `cond && '' || '--skip=sign'` it
          # yields --skip=sign in *both* cases, silently producing unsigned
          # releases with a signing key correctly configured.
          args: >-
            release --clean
            ${{ env.HAS_GPG_KEY != 'true' && '--skip=sign' || '' }}
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the release is actually signed
        if: env.HAS_GPG_KEY == 'true'
        run: |
          set -euo pipefail
          sig=$(ls dist/*_SHA256SUMS.sig 2>/dev/null || true)
          if [ -z "${sig}" ]; then
            echo "::error::A signing key is configured but no .sig was produced."
            echo "::error::The Terraform Registry rejects releases without one."
            exit 1
          fi
          if head -c 30 "${sig}" | grep -q "BEGIN PGP"; then
            echo "::error::Signature is ASCII armored; the registry requires binary."
            exit 1
          fi
          gpg --verify "${sig}" dist/*_SHA256SUMS
          echo "signed and verified: ${sig}"

      - name: Build the network mirror index
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Name every released version in index.json, not just this one, so the
          # index describes the whole mirror.
          others=$(git tag --list 'v*' | sed 's/^v//' | grep -v "^${version}$" | tr '\n' ' ')
          python3 scripts/mirror-index.py dist "${version}" --also-list ${others}

      - name: Attach the mirror index to the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release upload "${GITHUB_REF_NAME}" \
            "dist/index.json" "dist/${version}.json" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarise what was published
        run: |
          {
            echo "### Release ${GITHUB_REF_NAME}"
            echo
            if [ "${HAS_GPG_KEY}" = "true" ]; then
              echo "Checksums signed with the configured GPG key."
            else
              echo "**Unsigned** — no \`GPG_PRIVATE_KEY\` secret is configured."
              echo "Signing is required only for the Terraform Registry."
            fi
            echo
            echo '| Artifact | Count |'
            echo '|---|---|'
            echo "| provider archives | $(ls dist/terraform-provider-illumio-core_*.zip | wc -l) |"
            echo "| helper archives | $(ls dist/provision_*.zip dist/import_*.zip 2>/dev/null | wc -l) |"
          } >> "$GITHUB_STEP_SUMMARY"
